services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pravah-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pravah_v2}
      POSTGRES_USER: ${POSTGRES_USER:-pravah_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pravah_secure_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pravah_user} -d $${POSTGRES_DB:-pravah_v2}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
