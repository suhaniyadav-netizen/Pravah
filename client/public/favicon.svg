<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Brilliant Aqua-to-Ocean Water Volume Gradient -->
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48CAE4" />
      <stop offset="40%" stop-color="#0096C7" />
      <stop offset="100%" stop-color="#023E8A" />
    </linearGradient>

    <!-- Mid River Flow Wave Gradient -->
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="50%" stop-color="#0096C7" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>

    <!-- Cyan River Surge Wave Gradient -->
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#48CAE4" />
      <stop offset="100%" stop-color="#90E0EF" />
    </linearGradient>
  </defs>

  <!-- 1. Pure Water Droplet Body (Bright Vibrant Cyan & Blue - No Black Anywhere) -->
  <path
    d="M32 4 C30 8, 11 26, 11 41 C11 52.6, 20.4 62, 32 62 C43.6 62, 53 52.6, 53 41 C53 26, 34 8, 32 4 Z"
    fill="url(#dropGradient)"
  />

  <!-- 2. Lower Deep Water Volume Flow -->
  <path
    d="M12 43 C17 36, 24 35, 32 39 C40 43, 47 41, 52 35 C52.7 37, 53 39, 53 41 C53 52.6, 43.6 62, 32 62 C20.4 62, 11 52.6, 11 41 C11 40.5, 11 40, 11.1 39.5 C11.3 40.8, 11.6 42, 12 43 Z"
    fill="url(#waveGradient1)"
  />

  <!-- 3. Cyan River Wave Current (Pravah Motion) -->
  <path
    d="M12.5 39 C18 33, 25 32, 32 36 C39 40, 46 38, 51.5 33 C52.2 35, 52.6 37.2, 52.6 39.5 C46.5 44, 39 44.5, 32 41 C25 37.5, 18 39, 13 44 C12.7 42.5, 12.5 40.8, 12.5 39 Z"
    fill="url(#waveGradient2)"
  />

  <!-- 4. Water Rapid Foam Line (Crisp White) -->
  <path
    d="M14 38 C20 32.5, 26 32, 32 35.5 C38 39, 44 37.5, 50 32"
    stroke="#FFFFFF"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- 5. Secondary Lower Wave Ripple -->
  <path
    d="M18 48 C23 44, 28 44, 33 47 C38 50, 43 49, 47 45"
    stroke="#CAF0F8"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-opacity="0.8"
  />

  <!-- 6. Sunlight Reflection Arc on Droplet -->
  <path
    d="M30 8 C23 18, 17 27, 16 35 C15.5 30, 18.5 20, 26 12 Z"
    fill="#FFFFFF"
    opacity="0.75"
  />

  <!-- 7. Bright Sparkle Highlights -->
  <circle cx="26.5" cy="18" r="3" fill="#FFFFFF" />
  <circle cx="34" cy="24" r="1.5" fill="#FFFFFF" opacity="0.6" />
</svg>
