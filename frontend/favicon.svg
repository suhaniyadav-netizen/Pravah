<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Aqua-to-Ocean Water Volume Gradient -->
    <linearGradient id="waterDrop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="35%" stopColor="#0ea5e9" />
      <stop offset="70%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>

    <!-- Deep River Undercurrent Gradient -->
    <linearGradient id="riverWaveDeep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="50%" stopColor="#0369a1" />
      <stop offset="100%" stopColor="#075985" />
    </linearGradient>

    <!-- Turquoise River Surge Gradient -->
    <linearGradient id="waveAqua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22d3ee" />
      <stop offset="50%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <!-- Surface Foam & Rapid Highlight Gradient -->
    <linearGradient id="riverWaveCrest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#e0f2fe" />
      <stop offset="50%" stopColor="#bae6fd" />
      <stop offset="100%" stopColor="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Pure Water Droplet Body (Transparent Background - No Dark Box) -->
  <path
    d="M32 3 C29 8, 10 27, 10 42 C10 54.15, 19.85 62, 32 62 C44.15 62, 54 54.15, 54 42 C54 27, 35 8, 32 3 Z"
    fill="url(#waterDrop)"
  />

  <!-- Deep River Current Wave Inside Drop -->
  <path
    d="M10.8 44 C15 37, 24 35, 31 39 C38 43, 47 41, 53.2 35 C53.8 37.3, 54 39.6, 54 42 C54 54.15, 44.15 62, 32 62 C22.6 62, 14.7 56.1, 11.8 47.7 C11.3 46.5, 11 45.3, 10.8 44 Z"
    fill="url(#riverWaveDeep)"
  />

  <!-- Aqua Mid-Current Swell (Pravah Flow) -->
  <path
    d="M11 39 C17 32, 25 31, 32 35 C39 39, 47 37, 53 30 C53.5 32.5, 53.8 35, 53.6 37 C47 43, 38 44, 31 40 C24 36, 16 38, 11.5 44 C11.2 42.3, 11 40.7, 11 39 Z"
    fill="url(#waveAqua)"
    opacity="0.92"
  />

  <!-- White Foaming River Wave Crest Streamline -->
  <path
    d="M13 38 C19 32, 26 31.5, 32 35 C38 38.5, 45 37, 51 31"
    stroke="url(#riverWaveCrest)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Secondary Water Ripple Streak -->
  <path
    d="M18 47 C23 43, 28 43, 33 46 C38 49, 44 48, 48 43"
    stroke="#ffffff"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-opacity="0.65"
  />

  <!-- Crystalline Water Sunlight Reflection Arc -->
  <path
    d="M30 8 C23 18, 17 28, 16 37 C15.5 31, 19 20, 27 12 Z"
    fill="#ffffff"
    opacity="0.65"
  />

  <!-- Specular Sunlight Glint Dot -->
  <circle cx="27" cy="18" r="2.8" fill="#ffffff" opacity="0.9" />

  <!-- Ambient Rim Glow -->
  <path
    d="M44 52 C48 48, 51 43, 52 38 C52.5 42, 50 48, 45 53 Z"
    fill="#ffffff"
    opacity="0.35"
  />
</svg>
