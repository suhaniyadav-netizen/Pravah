name: Pravah CI & Verification

on:
  push:
    branches:
      - main
      - pravah-v2
  pull_request:
    branches:
      - main
      - pravah-v2

jobs:
  verify-and-build:
    name: Verify Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm --prefix client install
          npm --prefix server install

      - name: Run Master Reliability & Failure Suite
        run: npm test

      - name: Run Client Production Build
        run: npm run build

      - name: Validate Vercel Configuration
        run: |
          node -e "
            const fs = require('fs');
            const rootVercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
            if (!rootVercel.services || !rootVercel.services.client) {
              console.error('Missing required services.client definition in vercel.json');
              process.exit(1);
            }
            console.log('✅ vercel.json services schema validated.');
          "
